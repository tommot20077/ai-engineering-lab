# agent 設定檔範例。複製一份再改:cp agent.example.toml agent.toml
# agent.toml 不進 git。API key 不放這裡,放 .env 的 ANTHROPIC_API_KEY(同 gateway、eval)。
# 打錯的欄位名稱會讓 agent 拒絕執行,不會被默默忽略。

# 必填,至少一個。`--model`、`[agent] model` 只能寫這裡的別名。
# 跟 gateway.toml、eval.toml 各自一份;011 的執行中路由表出現後再考慮共用。
[aliases]
default = "claude-sonnet-5-5"
cheap   = "claude-haiku-5-5"

[anthropic]
# 預設 https://api.anthropic.com。只有 localhost 可以用 http(給測試用的假 server)。
# base_url = "https://api.anthropic.com"

[agent]
# `--model` 沒給時用的別名。
model = "default"
# 每一輪模型回答的 token 上限。
max_tokens = 4096

# 護欄(design §5)。每一項至少是 1:可以調整,不能關掉。沒寫的用下面的預設值。
[limits]
# max_turns = 10              # 最多呼叫模型幾次
# max_tool_calls = 30         # 整次執行最多幾次工具呼叫
# max_parallel = 4            # 同一輪最多同時執行幾個工具
# max_total_tokens = 200000   # 每輪 input + output 的加總上限(每輪都重送整段對話)
# deadline_secs = 300         # 整次執行的總時間
# tool_timeout_secs = 30      # 每次工具呼叫的時間上限
# max_result_bytes = 32768    # 工具結果超過就截斷
# max_args_bytes = 65536      # 工具參數超過就不解析

[paths]
# 軌跡(每次執行一個 JSONL 檔)放在 <data_dir>/runs(700 / 600)。預設:
#   macOS ~/Library/Application Support/ai-engineering-lab/agent
#   Linux ~/.local/share/ai-engineering-lab/agent
# 相對路徑以「這個設定檔所在的目錄」為準。
# data_dir = "~/ai-lab-agent"
# 呼叫紀錄(階段 2 的原料)。預設跟 gateway 一樣,飛輪讀同一個地方;gateway.toml 改過 [record] dir 的話這裡也要改。
# records = "~/ai-lab-records"

# 每百萬 token 的美元價格,key 是實際的模型 id(不是別名)。有價格才顯示費用,沒有就顯示「未知」。
# [prices."claude-sonnet-5-5"]
# input = 2.0
# output = 10.0

# MCP server(可以有好幾個 [[mcp]]):把別人寫好的工具接給 agent。模型看到的工具名稱是 `<name>__<工具>`。
# 只提供 `tools` 白名單裡的工具;白名單裡的工具 server 沒有提供,或任何一個 server 連不上,agent 就不開始(結束碼 2)。
# 協定版本只支援 2026-07-28(舊版、要 `initialize` 的 server 會被拒絕)。
#
# stdio:agent 啟動子行程。子行程只拿到 PATH、HOME、LANG 與這裡的 `env`(API key 不會傳過去)。
# `command` 有 `/` 的話是路徑(相對路徑以這個設定檔所在的目錄為準),沒有就照 PATH 找。`args`、`env` 原樣傳遞(不展開 `~`)。
# [[mcp]]
# name = "notes"                       # 小寫英數字與 `_`,1~16 個字元
# command = "notes-mcp"
# args = ["--root", "/Users/me/notes"]
# env = { NOTES_DIR = "/Users/me/notes" }
# tools = ["search", "read"]            # 白名單,必填
#
# Streamable HTTP:只收 https(localhost 可以用 http);不跟隨 redirect。token 放環境變數,這裡只寫變數名稱。
# [[mcp]]
# name = "remote"
# url = "https://example.com/mcp"
# token_env = "REMOTE_MCP_SECRET"
# tools = ["lookup"]

# run_rust 的沙箱(`--allow-run` 時才用到):每次一個新容器,沒有網路、唯讀根目錄、nobody、上限如下(003 第三部分)。
# image 必須用 digest 鎖定;沙箱不自動下載,第一次先:
#   docker pull "$(cargo run -q -p sandbox --example run_rust -- --image)"
# 上限都可以調、不能是 0。limits.tool_timeout_secs 要比 compile + run 長(否則 run_rust 會在沙箱結束前被切掉)。
[sandbox]
# program = "docker"              # 或 "podman";有 `/` 的話是路徑(相對於這個設定檔)
# image = "docker.io/library/rust:1.99.1-slim@sha256:f6c4a35d21dbb3c89d7a8d056c193e94fc09037f2b58dd858b09c39a47dd02d7"
# compile_timeout_secs = 20
# run_timeout_secs = 5
# memory_mib = 512                # 整個容器(編譯器 + 程式),不能用 swap 繞過
# pids = 64                       # 同時存在的行程數(執行緒也算)
# output_kib = 64                 # stdout、stderr 各自保留多少
# scratch_mib = 64                # 工作目錄(tmpfs)
# code_kib = 64                   # 原始碼大小
