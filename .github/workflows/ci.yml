name: CI

# 所有分支的 push 都跑(D-036):session 預設開 worktree、在分支上工作,只認 main 的話,分支上的每一步都沒有 CI。
on:
  push:
    branches: ["**"]
  pull_request:

# 同一個 workflow + 同一個 ref 只留最新的一次:分支連續 push 時,舊的 run 已經過時,取消掉。
# main 每一次都要跑完(`cancel-in-progress` 只在不是 main 時為 true),每個推上 main 的 commit 都有結果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 只給讀取權限:CI 不需要寫入 repo,權限給最小(安全原則)。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup 會讀 rust-toolchain.toml,自動裝上鎖定的版本和元件。
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # feature 開關後面的程式(llm 的 bench-internals)平常不會被編譯;這一步確保它一直編譯得過。
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # `--locked`:Cargo.lock 跟 Cargo.toml 對不上就失敗,不自動更新。忘了 commit lock 檔時,CI 會抓到。
      - name: test
        run: cargo test --workspace --all-features --locked
      # 私有資料掃描與「擋下印出環境變數」這兩道護欄的測試(D-037)。
      - name: guard tests
        run: scripts/test-guards.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
