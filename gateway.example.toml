# gateway 設定檔範例。複製一份再改:cp gateway.example.toml gateway.toml
# gateway.toml 不進 git。秘密(API key、token)不放這裡,放 .env(D-024)。
# 打錯的欄位名稱會讓 gateway 拒絕啟動,不會被默默忽略。

[server]
# 只聽本機。改成其他位址(例如 0.0.0.0:8787)時,必須同時設定 allow_remote 與 allowed_hosts。
bind = "127.0.0.1:8787"
# allow_remote = false
# allowed_hosts = ["gateway.example.com:8787"]

# 必填,至少一個。請求的 "model" 只能寫這裡的別名,其他一律回 400(D-023)。
[aliases]
default = "claude-sonnet-5-5"
cheap   = "claude-haiku-5-5"

[anthropic]
# 預設 https://api.anthropic.com。只有 localhost 可以用 http(給測試用的假 server)。
# base_url = "https://api.anthropic.com"

[record]
# 每次呼叫留下一筆完整紀錄(階段 2 資料飛輪的原料,D-021)。
enabled = true
# 預設:macOS ~/Library/Application Support/ai-engineering-lab/gateway/records
#       Linux  ~/.local/share/ai-engineering-lab/gateway/records
# 相對路徑以「這個設定檔所在的目錄」為準。
# dir = "~/ai-lab-records"

[retry]
# 總共最多嘗試幾次(含第一次)。
max_attempts = 3
# 第一次失敗後最多等多久;之後每次加倍,最多 max_delay_ms。對方的 retry-after 超過上限就不等了。
first_delay_ms = 1000
max_delay_ms = 10000

[limits]
# 請求 body 上限(bytes)。
max_body_bytes = 10485760
# 同時呼叫上游的數量上限;超過回 429,保護你的 API 額度。
max_concurrent = 16
