# 根目錄是「虛擬 workspace」:只有 [workspace],沒有 [package]。
# 它本身不是一個 crate,只負責把 crates/ 底下的成員綁在一起,
# 讓它們共用同一份 Cargo.lock、同一個 target/、同一套設定。
# Go 對照:很像 go.work 把多個 module 綁在一起;Java 對照:Maven 的 parent pom。
[workspace]
members = ["crates/*"]
resolver = "3"

# 成員用 `version.workspace = true` 繼承這裡的值,不必每個 crate 各寫一份。
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tommot20077/ai-engineering-lab"
publish = false

# 共用的 lint 規則。成員用 `[lints] workspace = true` 套用。
[workspace.lints.rust]
# 整個專案禁止 unsafe。forbid 比 deny 更嚴:連在程式碼裡寫 #[allow] 都不能解除。
unsafe_code = "forbid"

[workspace.lints.clippy]
# 這四條會 panic,外部輸入的處理路徑上一律禁止(design.md §7)。
# 測試裡可以用,見 clippy.toml。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# 共用的依賴版本。成員用 `serde.workspace = true` 引用,版本只在這裡管一次。
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# raw_value:可以只「驗證」JSON 而不把它解析成一整棵樹(工具參數用,見 anthropic/translate.rs)。
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
# HTTP client。預設 TLS 是 rustls(加密實作 aws-lc-rs),並讀取作業系統的憑證庫。
reqwest = { version = "0.13", features = ["stream"] }
futures = "0.3"
# 用 `yield` 寫 async stream,讀起來像一般的迴圈。
async-stream = "0.3"
# API key 的包裝型別:Debug 印 [REDACTED]、沒有 Display(design.md §7)。
secrecy = "0.10"
# async runtime。這裡不開任何功能,由各成員自己挑需要的(llm 只要計時器,測試另外開 macros 等)。
tokio = { version = "1", default-features = false }
# 隨機數,只用來產生 retry 的 jitter。小、沒有依賴,不需要密碼學等級的亂數。
fastrand = "2"
# 營運 log。library 只「發出」事件,要不要輸出、輸出到哪裡由 binary 決定。
tracing = "0.1"
# 呼叫紀錄的 id。v7 的開頭是時間,依 id 排序就等於依時間排序(D-021)。
uuid = { version = "1", features = ["v7", "serde"] }
# 日期時間。用來記錄 UTC 時間、決定紀錄檔名;serde 讓時間直接序列化成 RFC 3339 字串。
jiff = { version = "0.2", features = ["serde"] }

# 只在測試用的依賴。
proptest = "1"
insta = { version = "1", features = ["json"] }
wiremock = "0.6"
# 讀 .env 檔。只給 examples 和測試用:library 本身不讀檔案也不讀環境變數(D-016)。
dotenvy = "0.15"
# benchmark。只開最基本的功能,不要畫圖和平行化,少拉很多依賴。
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
