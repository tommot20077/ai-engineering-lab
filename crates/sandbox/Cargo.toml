[package]
name = "sandbox"
description = "Compile and run untrusted single-file Rust in an isolated container"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
# `BoxFuture`:`Sandbox` 要能放進 `Arc<dyn Sandbox>`(agent 與 eval 只看得到 trait,測試可以換成假的)。
futures.workspace = true
# process:執行 `docker`;io-util:讀它的輸出、寫 stdin;time:每個階段的逾時;rt:取消時在背景收掉容器。
tokio = { workspace = true, features = ["process", "io-util", "time", "rt"] }
# 容器名稱:每次執行一個不會重複的名字,收掉時才不會刪到別人的容器。
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
tempfile.workspace = true
