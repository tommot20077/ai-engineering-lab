[package]
name = "gateway"
description = "HTTP shell around the llm crate: config, startup checks, composition"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
llm = { path = "../llm" }
config-loader = { path = "../config-loader" }
serde.workspace = true
thiserror.workspace = true
secrecy.workspace = true
# 解析與檢查 anthropic.base_url(scheme、host)。
url.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 讀 .env 是 binary 的事(D-016)。
dotenvy.workspace = true
axum.workspace = true
futures.workspace = true
serde_json.workspace = true
subtle.workspace = true
# runtime(main)、TcpListener、Ctrl+C / SIGTERM、Semaphore(並行上限)、timeout。
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
toml.workspace = true
tempfile.workspace = true
# 測試多開 test-util:暫停時間,逾時測試不必真的等。
# process + io-util:E2E 測試(tests/e2e.rs)啟動 gateway 子行程、一行一行讀它的 stderr。
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "process", "io-util"] }
tower.workspace = true
# E2E:真的 HTTP client 打真的 gateway;wiremock 扮演上游的 Claude。
reqwest.workspace = true
wiremock.workspace = true
