[package]
name = "llm"
description = "Provider-agnostic, streaming-first LLM client core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true
futures.workspace = true
async-stream.workspace = true
secrecy.workspace = true
# 只開計時器:Retry 等待用的 `tokio::time::sleep`(design-part2.md §14)。
tokio = { workspace = true, features = ["time"] }
fastrand.workspace = true
tracing.workspace = true
uuid.workspace = true
jiff.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
# 測試多開:`#[tokio::test]` 需要 macros 與 runtime;test-util 讓測試裡的時間可以「暫停、快轉」。
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock.workspace = true
tempfile.workspace = true
dotenvy.workspace = true
criterion.workspace = true

# `harness = false`:不用 Rust 內建的測試框架跑,改由 criterion 自己的 main 接手。
[[bench]]
name = "sse"
harness = false
