# cargo-deny:檢查依賴的供應鏈安全(CLAUDE.md「測試策略」)。

[advisories]
# 依賴有已知漏洞(RustSec 資料庫)就失敗。
yanked = "deny"

[licenses]
# 只接受寬鬆授權;出現 GPL 之類會失敗,避免授權污染。
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    # 寬鬆的「資料」授權:webpki-root-certs 打包的 Mozilla 根憑證清單用這個(reqwest → rustls)。
    "CDLA-Permissive-2.0",
    # MIT 去掉「要保留版權聲明」那一條,比 MIT 更寬鬆:borrow-or-share(jsonschema → referencing → fluent-uri,003 第二部分)。
    "MIT-0",
    # OSI 認可的寬鬆授權(只要求不冒充原作者、改過要註明):foldhash 0.2(hashbrown 0.17 → indexmap,加 jsonschema 時升版)。
    "Zlib",
    # Apache-2.0 加上 LLVM 的例外條款:例外只「多給」權限(編譯進執行檔時不必附上授權聲明),比 Apache-2.0 更寬鬆。
    # winx(cap-fs-ext 在 Windows 上的依賴,003 第三部分);bytecodealliance 的 crate 大多用它。
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
# 同一個套件被拉進多個版本時提醒(會讓編譯變慢、執行檔變大)。
multiple-versions = "warn"

[sources]
# 只能從 crates.io 下載,不准來路不明的 git repo 或 registry。
unknown-registry = "deny"
unknown-git = "deny"

[licenses.private]
# 自己的 crate 設了 publish = false,不檢查它們本身的授權。
ignore = true
